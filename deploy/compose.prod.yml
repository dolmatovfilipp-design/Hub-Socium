# Hub production-ish compose skeleton (PB-01).
# Copy env template → .env.prod (gitignored). Never put real secrets in this file.
#
# Bring up:  docker compose -f deploy/compose.prod.yml --env-file deploy/.env.prod up -d --build
# See deploy/README.md

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hub}
    volumes:
      - hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Do not publish 5432 to the public internet in real prod.

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://hub.example.com}
      # Optional: SENTRY_DSN, HUB_ENV=production
      HUB_ENV: ${HUB_ENV:-production}
    # Internal only; Caddy proxies externally.
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # TLS: Caddy obtains Let's Encrypt certs when HUB_DOMAIN is a real public DNS name.

  # Optional nginx alternative (commented):
  # nginx:
  #   image: nginx:1.27-alpine
  #   depends_on: [api]
  #   ports: ["80:80", "443:443"]
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro

volumes:
  hub_pgdata:
  caddy_data:
  caddy_config:
