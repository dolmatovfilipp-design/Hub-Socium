# Hub production-ish compose skeleton (PB-01).
# Copy env template → .env.prod (gitignored). Never put real secrets in this file.
#
# Bring up:  docker compose -f deploy/compose.prod.yml --env-file deploy/.env.prod up -d --build
# See deploy/README.md

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hub}
    volumes:
      - hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Do not publish 5432 to the public internet in real prod.

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://hub.example.com}
      # Optional: SENTRY_DSN, HUB_ENV=production
      HUB_ENV: ${HUB_ENV:-production}
      # Whisper on the stt service (OpenAI-compatible /v1/audio/transcriptions).
      STT_URL: ${STT_URL:-http://stt:8000}
      STT_LANGUAGE: ${STT_LANGUAGE:-ru}
      STT_MODEL: ${STT_MODEL:-Systran/faster-whisper-small}
      MEDIA_DIR: ${MEDIA_DIR:-.data/media}
      # Translation: LibreTranslate URL, else OpenAI / Yandex keys, else keyless fallback.
      TRANSLATE_URL: ${TRANSLATE_URL:-}
      TRANSLATE_API_KEY: ${TRANSLATE_API_KEY:-}
      TRANSLATE_FALLBACK: ${TRANSLATE_FALLBACK:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      YANDEX_GPT_API_KEY: ${YANDEX_GPT_API_KEY:-}
      YANDEX_GPT_FOLDER: ${YANDEX_GPT_FOLDER:-}
    depends_on:
      postgres:
        condition: service_healthy
      stt:
        condition: service_started
    # Internal only; Caddy proxies externally.
    expose:
      - "8080"

  # Self-hosted Whisper (faster-whisper via Speaches). API posts audio to
  # http://stt:8000/v1/audio/transcriptions. First start downloads the model.
  stt:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    environment:
      PRELOAD_MODELS: '["${STT_MODEL:-Systran/faster-whisper-small}"]'
      WHISPER__MODEL: ${STT_MODEL:-Systran/faster-whisper-small}
      WHISPER__INFERENCE_DEVICE: cpu
    volumes:
      - stt_models:/home/ubuntu/.cache/huggingface/hub
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # TLS: Caddy obtains Let's Encrypt certs when HUB_DOMAIN is a real public DNS name.

  # Optional nginx alternative (commented):
  # nginx:
  #   image: nginx:1.27-alpine
  #   depends_on: [api]
  #   ports: ["80:80", "443:443"]
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro

volumes:
  hub_pgdata:
  caddy_data:
  caddy_config:
  stt_models:
